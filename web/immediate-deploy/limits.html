<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tevumi · 小额通道限额配置</title><link rel="stylesheet" href="./style.css"></head><body class="limit-admin">
<main><p class="eyebrow">TEVUMI · MAINNET CONFIGURATION</p><h1>调整单笔跨链上限</h1><p class="lead">币安人生和 CAT 的单笔上限从 0.000001 调整为 0.000002 枚。BNB Chain 和 Arc 各需一笔管理配置交易；成功回执后即时生效。累计额度和锁仓容量保持原值。</p><div class="warning">仅指定管理钱包可签署。请核对钱包弹窗中的网络和管理合约地址。结果不明时不要重复提交；本页不发送资产。</div>
<section class="card"><h2>双链配置</h2><p id="wallet-state">未连接管理钱包</p><button id="connect">连接管理钱包</button><button id="configure" disabled>开始 / 继续配置</button><button id="refresh" class="secondary">刷新链上状态</button><p id="message" role="status" aria-live="polite"></p></section>
<section class="card"><h2>配置进度</h2><p id="state-bsc">BNB Chain：正在读取…</p><p id="state-arc">Arc：正在读取…</p><div id="recovery" hidden><p>钱包结果不明时，请从钱包活动记录复制原交易哈希核验。</p><select id="recovery-side"><option value="bsc">BNB Chain</option><option value="arc">Arc</option></select><input id="recovery-hash" aria-label="原交易哈希" placeholder="原交易哈希 0x…"><button id="recover" class="secondary">按原哈希核验</button></div></section><p class="foot"><a href="/">返回跨链首页</a> · 配置交易不会发起跨链。</p></main><script type="module" src="./limits.js"></script></body></html>
